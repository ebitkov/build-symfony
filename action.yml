name: 'Build Symfony App'
description: 'Builds and optionally tests a Symfony app'

inputs:
  repository:
    description: 'Repository to fetch'
    required: false
    default: '${{ github.repository }}'
  branch:
    description: 'Target branch to fetch'
    required: false
    default: 'main'
  path:
    description: 'Directory (relative to the workspace) to check out and build the app in. Also the cached path.'
    required: false
    default: './'
  build-webpack-assets:
    description: 'Whether to build webpack assets or not'
    required: false
    default: 'false'
  node-version:
    description: 'Node.js version to use when building webpack assets'
    required: false
    default: '24'
  run-tests:
    description: 'Whether to run tests with PHPUnit or not'
    required: false
    default: 'false'
  cache-build:
    description: 'Whether to cache the build for reuse in different jobs.'
    required: false
    default: 'false'
  cache-key-prefix:
    description: 'Prefix to use for the cache key used for caching the build output.'
    required: false
    default: 'symfony-build-'

  lfs:
    description: 'Whether to download Git-LFS files'
    required: false
    default: 'false'

  php-version:
    description: 'PHP version to use'
    required: false
    default: '8.4'
  php-extensions:
    description: 'PHP extensions to install'
    required: false
    default: 'mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, dom, filter, gd, json'

  composer-options:
    description: 'Additional Composer options'
    required: false
    default: '--prefer-dist'
  composer-additional-dependencies:
    description: 'Additional Composer dependencies to install on build.'
    required: false
    default: ''

  symfony-environment:
    description: 'Symfony environment to build'
    required: false
    default: 'dev'

  github-token:
    description: 'Github Access Token'
    required: false
    default: ''
  ssh-private-key:
    description: 'SSH private key loaded into ssh-agent, for Composer packages fetched via SSH'
    required: false
    default: ''

outputs:
  cache-key:
    description: Cache key for restoring build. Input `cache-build` has to be set to 'true'.
    value: ${{ steps.cache-key.outputs.cache-key }}

runs:
  using: 'composite'
  steps:
    # Setup PHP
    - uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.php-extensions }}
        tools: composer, flex, symfony

    # Fetch the repo
    - uses: actions/checkout@v7
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.branch }}
        path: ${{ inputs.path }}
        lfs: ${{ inputs.lfs }}
        token: ${{ inputs.github-token != '' && inputs.github-token || github.token }}

    # Setup .env.local
    - run: echo "APP_ENV=$APP_ENV" > .env.local
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        APP_ENV: ${{ inputs.symfony-environment }}

    # Cache Composer
    - id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      shell: bash
      working-directory: ${{ inputs.path }}
    - uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    # Auth Composer
    - if: ${{ inputs.github-token != '' }}
      run: composer config --auth github-oauth.github.com "$COMPOSER_TOKEN"
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        COMPOSER_TOKEN: ${{ inputs.github-token }}

    # Auth Composer via SSH
    # ponytail: only trusts github.com host keys, add an ssh-known-hosts input when other git hosts are needed
    - if: ${{ inputs.ssh-private-key != '' }}
      run: |
        eval "$(ssh-agent -s)"
        echo "$SSH_KEY" | ssh-add -
        echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
        echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
        mkdir -p ~/.ssh
        ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh-private-key }}

    # Install dependencies with Composer (prod: no dev deps, optimized autoloader)
    - run: symfony composer install --no-interaction --no-progress --ansi $PROD_FLAGS $COMPOSER_OPTIONS
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        COMPOSER_OPTIONS: ${{ inputs.composer-options }}
        PROD_FLAGS: ${{ inputs.symfony-environment == 'prod' && '--no-dev --optimize-autoloader' || '' }}

    # Install additional dependencies
    - if: ${{ inputs.composer-additional-dependencies != '' }}
      run: symfony composer require --no-interaction $PROD_FLAGS $COMPOSER_DEPS
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        COMPOSER_DEPS: ${{ inputs.composer-additional-dependencies }}
        PROD_FLAGS: ${{ inputs.symfony-environment == 'prod' && '--update-no-dev' || '' }}

    # Install Test-Pack, if required (pulls in dev dependencies, even in prod)
    - if: ${{ inputs.run-tests == 'true' }}
      run: symfony composer require --dev --no-interaction test
      shell: bash
      working-directory: ${{ inputs.path }}

    # Setup Node
    - if: ${{ inputs.build-webpack-assets == 'true' }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    # Cache the npm download cache (node_modules is wiped by `npm ci` anyway)
    # ponytail: not setup-node's `cache: npm`, it fails when there is no lock file
    - if: ${{ inputs.build-webpack-assets == 'true' }}
      uses: actions/cache@v6
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json', '**/package.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-

    # Install packages and build assets with NPM
    - if: ${{ inputs.build-webpack-assets == 'true' }}
      run: |
        if [ -f package-lock.json ]; then npm ci; else npm install; fi
        npx encore production
      shell: bash
      working-directory: ${{ inputs.path }}

    # AssetMapper (auto-detected): download vendor assets, compile them for prod
    - run: |
        if [ -f importmap.php ]; then
          symfony console importmap:install
          if [ "$APP_ENV" = prod ]; then symfony console asset-map:compile; fi
        fi
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        APP_ENV: ${{ inputs.symfony-environment }}

    # Finalize prod build: compiled env file and warm cache
    - if: ${{ inputs.symfony-environment == 'prod' }}
      run: |
        symfony composer dump-env prod
        symfony console cache:warmup
      shell: bash
      working-directory: ${{ inputs.path }}

    # Run tests with PHPUnit
    - if: ${{ inputs.run-tests == 'true' }}
      run: |
        if [ -f bin/phpunit ]; then symfony php bin/phpunit; else symfony php vendor/bin/phpunit; fi
      shell: bash
      working-directory: ${{ inputs.path }}

    - id: cache-key
      if: ${{ inputs.cache-build == 'true' }}
      run: |
        rm -f .env.local
        echo "cache-key=${CACHE_KEY_PREFIX}${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        CACHE_KEY_PREFIX: ${{ inputs.cache-key-prefix }}

    - if: ${{ inputs.cache-build == 'true' }}
      uses: actions/cache/save@v6
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.cache-key.outputs.cache-key }}
